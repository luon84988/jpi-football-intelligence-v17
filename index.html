<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPi Football Intelligence V17</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
            <h1 class="text-xl font-bold text-emerald-400">⚽ JPi V17 量化决策看板</h1>
            <p id="update-time" class="text-xs text-gray-400 mt-1">同步中...</p>
        </div>
        <div class="bg-gray-800 rounded-2xl border border-gray-700 p-6">
            <h2 class="font-bold mb-4">🎯 赛事预测列表</h2>
            <div id="match-list" class="space-y-3"></div>
        </div>
    </div>
    <script>
        async function loadData() {
            try {
                const res = await fetch('dashboard_data.json');
                const data = await res.json();
                document.getElementById('update-time').innerText = `最后更新: ${data.update_time}`;
                const list = document.getElementById('match-list');
                list.innerHTML = data.matches.map(m => `
                    <div class="bg-gray-900 p-4 rounded-xl border border-gray-700 flex justify-between items-center">
                        <div>
                            <span class="text-xs text-emerald-400 font-bold">${m.league}</span>
                            <div class="font-bold text-white mt-1">${m.home} vs ${m.away}</div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs bg-emerald-900 text-emerald-300 px-2.5 py-1 rounded-full">${m.recommendation}</span>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.log("等待数据生成..."); }
        }
        loadData();
    </script>
</body>
</html>
