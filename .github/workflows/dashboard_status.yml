name: JPi Dashboard source-state regression
on:
  pull_request:
    paths:
      - 'app/page.js'
      - 'app/dashboard-status.mjs'
      - 'tests/dashboard-status.test.mjs'
      - '.github/workflows/dashboard_status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-state labels and no fabricated metrics
        run: node --test tests/dashboard-status.test.mjs
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Build full Worker UI
        run: npm run build
