name: JPi V17 Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run export data script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          JPI_API_URL: ${{ vars.JPI_API_URL }}
        run: |
          python export_data.py

      - name: Commit and push generated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.io"
          git add dashboard_data.json
          git commit -m "Auto-update dashboard data [skip ci]" || exit 0
          git push

