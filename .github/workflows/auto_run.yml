name: JPi V17 Auto Run

on:
  pull_request:
    paths:
      - 'export_data.py'
      - 'scripts/monitor_production.py'
      - 'scripts/domestic.py'
      - 'scripts/upload_observations.py'
      - 'scripts/publish_dashboard.py'
      - 'tests/**'
      - '.github/workflows/production_health.yml'
      - 'tests/test_export_data.py'
      - '.github/workflows/auto_run.yml'
  push:
    branches: [main]
    paths:
      - 'export_data.py'
      - 'scripts/domestic.py'
      - 'scripts/upload_observations.py'
      - 'scripts/publish_dashboard.py'
      - '.github/workflows/auto_run.yml'
  workflow_dispatch:
    inputs:
      SITES_SERVICE_TOKEN:
        required: false
      API_KEY:
        required: false
  workflow_call:
  schedule:
    - cron: '7,27,47 * * * *'
    - cron: '20 13 * * *'
    - cron: '30 13 * * *'

concurrency:
  group: jpi-v17-auto-run
  cancel-in-progress: false

env:
  JPI_ALLOW_THIRD_PARTY_OBSERVATIONS: '1'

permissions:
  contents: read

jobs:
  test_export:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    env:
      JPI_ALLOW_THIRD_PARTY_OBSERVATIONS: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test export validation and fail-closed behavior
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  run_pipeline:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test_export
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify live API configuration
        env:
          JPI_API_URL: ${{ vars.JPI_API_URL }}
        run: |
          if [ -z "$JPI_API_URL" ]; then
            echo "::error::缺少存储库变量 JPI_API_URL。请将其设置为已部署的 JPi Worker 基本 URL；模拟数据已禁用。"
            exit 1
          fi

      - name: Collect current 500 and OKOOO evidence
        id: domestic
        continue-on-error: true
        run: python scripts/domestic.py

      - name: Upload raw evidence and original snapshot to private site D1
        env:
          JPI_API_URL: ${{ vars.JPI_API_URL }}
          SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
        run: python scripts/upload_observations.py

      - name: Check Worker API self-test
        env:
          JPI_API_URL: ${{ vars.JPI_API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
          MAX_SOURCE_AGE_SECONDS: '1800'
        run: |
          python - <<'PY'
          import os
          from export_data import source_endpoint, fetch_live_data
          endpoint = source_endpoint(os.environ['JPI_API_URL'])
          payload = fetch_live_data(endpoint)
          print('已验证当前来源（官方核验前的 PRE_ANALYSIS 观察结果）；匹配数：', len(payload['matches']))
          PY

      - name: Export live data for evaluation
        env:
          JPI_API_URL: ${{ vars.JPI_API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
          MAX_SOURCE_AGE_SECONDS: '1800'
        run: python export_data.py

      - name: Publish current main branch snapshot and limit retry count
        run: python scripts/publish_dashboard.py

      - name: Keep watching domestic live API and preserve fail-closed
        if: always() && steps.domestic.outcome == 'failure'
        run: |
          echo "::error::国内直播来源当前的无核验的观察结果已入选或来源缺口；继续保留监控报警，未颁发正式认证。"
          exit 2
