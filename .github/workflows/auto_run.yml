name: JPi V17 Auto Run

on:
  pull_request:
    paths:
      - 'export_data.py'
      - 'scripts/domestic.py'
      - 'scripts/upload_observations.py'
      - 'tests/**'
      - '.github/workflows/production_health.yml'
      - 'tests/test_export_data.py'
      - '.github/workflows/auto_run.yml'
  push:
    branches: [main]
    paths:
      - 'export_data.py'
      - 'scripts/domestic.py'
      - 'scripts/upload_observations.py'
      - '.github/workflows/auto_run.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '20 13 * * *'
    - cron: '30 13 * * *'

concurrency:
  group: jpi-observation-publication
  cancel-in-progress: false

env:
  JPI_ALLOW_THIRD_PARTY_OBSERVATIONS: '1'

permissions:
  contents: read

jobs:
  test-export:
    runs-on: ubuntu-latest
    env:
      JPI_ALLOW_THIRD_PARTY_OBSERVATIONS: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test export validation and fail-closed behavior
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  run-script:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate live API configuration
        env:
          JPI_API_URL: ${{ vars.JPI_API_URL }}
        run: |
          if [ -z "$JPI_API_URL" ]; then
            echo "::error::Missing repository variable JPI_API_URL. Set it to the deployed JPi Worker base URL; mock data is disabled."
            exit 1
          fi

      - name: Collect current 500 and OKOOO evidence
        run: python scripts/domestic.py

      - name: Persist observations and raw evidence to private Site D1
        env:
          JPI_API_URL: ${{ vars.JPI_API_URL }}
          SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
        run: python scripts/upload_observations.py

      - name: Check Worker API availability
        env:
          JPI_API_URL: ${{ vars.JPI_API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
          MAX_SOURCE_AGE_SECONDS: '1800'
        run: |
          python - <<'PY'
          import os
          from export_data import source_endpoint, fetch_live_data
          endpoint = source_endpoint(os.environ['JPI_API_URL'])
          payload = fetch_live_data(endpoint)
          print('Verified current source (official or explicit PRE_ANALYSIS observations); matches:', len(payload['matches']))
          PY

      - name: Export and validate live data
        env:
          JPI_API_URL: ${{ vars.JPI_API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
          MAX_SOURCE_AGE_SECONDS: '1800'
        run: python export_data.py

      - name: Commit and push dashboard snapshot only when changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json
          if git diff --cached --quiet; then
            echo "Validated snapshot is unchanged; no commit required."
            exit 0
          fi
          git commit -m "Auto-update dashboard data from live API [skip ci]"
          git push origin HEAD:main


