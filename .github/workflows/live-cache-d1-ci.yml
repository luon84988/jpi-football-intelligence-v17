name: D1 Official Feed Persistence Regression

on:
  pull_request:
    paths:
      - 'worker/live-football-cache.ts'
      - 'worker/index.ts'
      - 'tests/live-football-cache.test.mjs'
      - '.github/workflows/live-cache-d1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-live-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify awaited D1 write and readback fail-closed behavior
        run: node --experimental-strip-types --test tests/live-football-cache.test.mjs
      - name: Install pinned dependencies
        run: npm run install:ci
      - name: Build full Worker
        run: npm run build
