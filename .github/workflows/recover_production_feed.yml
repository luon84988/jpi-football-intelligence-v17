name: JPi Production Feed Recovery

on:
  workflow_run:
    workflows: [JPi Production Health Monitor]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  refresh-current-feed:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
    uses: ./.github/workflows/auto_run.yml
    secrets:
      SITES_SERVICE_TOKEN: ${{ secrets.SITES_SERVICE_TOKEN }}
      API_KEY: ${{ secrets.API_KEY }}
