name: Official Odds Append-only History CI
on:
  pull_request:
    paths:
      - 'worker/official-odds-history.ts'
      - 'worker/index.ts'
      - 'tests/official-odds-history.test.mjs'
      - 'tests/official_odds_history_sqlite_test.py'
      - '.github/workflows/official-odds-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-odds-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test history and live D1 readback
        run: node --experimental-strip-types --test tests/official-odds-history.test.mjs tests/live-football-cache.test.mjs
      - name: Verify transition SQL on SQLite
        run: python3 tests/official_odds_history_sqlite_test.py -v
      - name: Build full Worker
        run: npm run build
